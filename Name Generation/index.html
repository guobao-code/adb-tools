<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人名生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>人名生成器</h1>
        
        <div class="form-group">
            <label for="nameType">人名类型:</label>
            <select id="nameType">
                <option value="chinese">中文人名</option>
                <option value="english">英文人名</option>
            </select>
        </div>

        <div class="form-group">
            <label for="gender">性别:</label>
            <select id="gender">
                <option value="random">随机</option>
                <option value="male">男性</option>
                <option value="female">女性</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nameCount">生成数量:</label>
            <input type="number" id="nameCount" min="1" max="100" value="10">
        </div>

        <div class="form-group chinese-options">
            <label for="nameLength">名字字数:</label>
            <select id="nameLength">
                <option value="random">随机</option>
                <option value="2">两个字</option>
                <option value="3">三个字</option>
                <option value="4">四个字</option>
            </select>
        </div>

        <div class="form-group english-options" style="display: none;">
            <label for="nameStyle">风格:</label>
            <select id="nameStyle">
                <option value="traditional">传统</option>
                <option value="modern">现代</option>
                <option value="unique">独特</option>
            </select>
        </div>

        <button id="generateBtn" class="btn">生成人名</button>
        <button id="copyBtn" class="btn btn-secondary">复制结果</button>

        <div class="result">
            <h2>生成结果:</h2>
            <div id="nameList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
